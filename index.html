<style>
:root{
  --bg:#FBF9F5; --card:#FFFFFF; --ink:#23261F; --muted:#857F73;
  --green:#4A7C59; --green-deep:#3A6347; --green-soft:#E8F1EA;
  --clay:#C4714B; --clay-soft:#FBEDE6;
  --gold:#B8893B; --gold-soft:#FBF2DF;
  --red:#C4453F; --red-soft:#FBEAE9;
  --blue:#4A6FA5; --blue-soft:#EAF0F8;
  --line:#EDE7DC;
  --r:20px; --r-s:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;font-weight:900}
h1{font-size:28px;letter-spacing:-.4px}
h2{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;font-size:68px;text-align:center}
.splash small{font-size:19px;font-weight:900;color:var(--green)}
#app{padding:14px 16px 0;max-width:600px;margin:0 auto}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.top .sub{color:var(--muted);font-size:14px;font-weight:700}

/* bottoni */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:15px;background:var(--green);color:#fff;font-weight:900;font-size:17px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--green-soft);color:var(--green-deep)}
.btn.clay{background:var(--clay)}
.btn.gold{background:var(--gold)}
.btn.blue{background:var(--blue)}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--muted);min-height:42px}
.btn.sm{min-height:38px;font-size:15px;padding:0 13px;width:auto;border-radius:11px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.row.tight > *{flex:none}

/* modalità negozio */
.shop-btn{width:100%;background:var(--clay);color:#fff;border-radius:var(--r);padding:16px;font-size:19px;font-weight:900;box-shadow:0 8px 20px rgba(196,113,75,.3);margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.shop-hd{background:var(--clay);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.shop-hd .big{font-size:24px;font-weight:900}

/* card generiche */
.list{background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px rgba(35,38,31,.05);overflow:hidden}
.it{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .e{font-size:24px;flex:none;line-height:1.2}
.it .b{flex:1;min-width:0}
.it .b b{display:block;font-size:17px}
.it .b .sub{font-size:13.5px;color:var(--muted);margin-top:1px}
.it .rt{flex:none;text-align:right;font-weight:900;font-size:15px;max-width:38%}
.it .val{font-weight:900;font-size:19px;margin-top:2px;color:var(--green-deep)}
.it.ok{background:var(--green-soft)}
.it .acts{display:flex;gap:4px;flex:none}
.it .ico{color:var(--muted);font-size:17px;padding:4px 5px}

/* chip / badge */
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;margin-right:4px}
.tag.p1{background:var(--red-soft);color:var(--red)}
.tag.p2{background:var(--gold-soft);color:var(--gold)}
.tag.p3{background:var(--line);color:var(--muted)}
.tag.st{background:var(--blue-soft);color:var(--blue)}
.tag.done{background:var(--green-soft);color:var(--green)}
.tag.late{background:var(--red-soft);color:var(--red)}
.heart{flex:none;font-size:20px;padding:4px 6px;border-radius:10px}
.heart.on{background:var(--red-soft)}

/* barre budget */
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.warn{background:var(--gold)}
.bar i.over{background:var(--red)}

/* riquadri numerici */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:var(--r-s);padding:11px 8px;text-align:center;box-shadow:0 2px 10px rgba(35,38,31,.05)}
.stat b{display:block;font-size:19px}
.stat span{font-size:11.5px;color:var(--muted)}
.banner{background:var(--gold-soft);color:#7A5B20;border-radius:var(--r-s);padding:11px 13px;font-weight:700;margin-bottom:10px;font-size:15px}
.banner.late{background:var(--red-soft);color:var(--red)}
.banner.info{background:var(--blue-soft);color:#2E4C78}

/* sezioni */
.sec{margin:20px 0 9px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:3px 0 9px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border-radius:999px;padding:7px 13px;background:var(--card);font-weight:800;border:2px solid var(--line);font-size:14.5px;white-space:nowrap}
.filters button.on{border-color:var(--green);background:var(--green-soft);color:var(--green-deep)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:17px;padding:14px 8px;text-align:center;font-weight:900;font-size:15.5px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tile span{font-size:27px;line-height:1}
.tile:active{transform:scale(.96)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-weight:700}
.empty span{font-size:40px;display:block;margin-bottom:5px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.ph img{border-radius:10px;aspect-ratio:1;object-fit:cover;width:100%}
.ph .add{border:2px dashed var(--line);border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted)}

/* form */
label{display:block;font-weight:800;font-size:13.5px;color:var(--muted);margin:11px 0 0}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:11px 13px;border:2px solid var(--line);border-radius:13px;background:#fff;font-size:16.5px;font-weight:700;color:var(--ink)}
label textarea{min-height:70px;resize:vertical}
label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--green)}
label.ck{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);margin-top:13px}
label.ck input{width:23px;height:23px;margin:0;accent-color:var(--green)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choices{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.choices button{border-radius:999px;padding:9px 14px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:15px}
.choices button.on{border-color:var(--green);background:var(--green-soft);color:var(--green-deep)}
.field{display:flex;justify-content:space-between;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field span:first-child{color:var(--muted);flex:none}
.field span:last-child{font-weight:800;text-align:right;overflow-wrap:anywhere}

/* sheet */
#overlay{position:fixed;inset:0;background:rgba(35,38,31,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#overlay[hidden]{display:none}
#sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:13px 17px calc(22px + var(--safe-b));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(36px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#sheet .handle{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 9px}
#sheet form .btn{margin-top:16px}
.close{position:absolute;right:17px;margin-top:-2px;font-size:21px;color:var(--muted);padding:5px 9px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 5px calc(8px + var(--safe-b));z-index:30}
#nav[hidden]{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--muted);padding:6px 0;border-radius:11px}
#nav button span{font-size:21px}
#nav button.on{color:var(--green-deep);background:var(--green-soft)}

#toast{position:fixed;left:50%;transform:translateX(-50%);top:13px;background:var(--ink);color:#fff;padding:11px 17px;border-radius:13px;font-weight:800;z-index:99;max-width:90%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#toast[hidden]{display:none}
#toast.err{background:var(--red)}
.login{max-width:380px;margin:11vh auto 0;text-align:center}
.login .logo{font-size:66px}
.login form{text-align:left;margin-top:18px}
.members{display:flex;gap:7px;flex-wrap:wrap}
.members span{background:var(--card);border-radius:999px;padding:7px 13px;font-weight:800;border:2px solid var(--line);font-size:15px}
a{color:var(--green-deep);font-weight:800}

</style>
</head>
<body>
<div id="app"><div class="splash">🏠<br><small>Casa Nuova</small></div></div>
<nav id="nav" hidden>
  <button data-a="nav" data-v="today"><span>🏠</span>Oggi</button>
  <button data-a="nav" data-v="rooms"><span>📐</span>Stanze</button>
  <button data-a="nav" data-v="buy"><span>🛒</span>Acquisti</button>
  <button data-a="nav" data-v="budget"><span>💰</span>Budget</button>
  <button data-a="nav" data-v="archive"><span>📁</span>Archivio</button>
</nav>
<div id="overlay" hidden><div id="sheet" role="dialog"></div></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   CASA NUOVA 🏠 — app privata per due
   ============================================================ */
'use strict';

const CFG = (() => {
  const f = window.CASA_CONFIG || {};
  if (f.SUPABASE_URL && f.SUPABASE_ANON_KEY) return f;
  try { const l = JSON.parse(localStorage.getItem('casa_config') || 'null'); if (l && l.SUPABASE_URL && l.SUPABASE_ANON_KEY) return l; } catch {}
  return null;
})();
if (!CFG) {
  document.getElementById('app').innerHTML = `<div class="login">
    <div class="logo">🏠</div><h1>Casa Nuova</h1>
    <p class="muted">Prima volta: incolla le due chiavi di Supabase (le stesse di Kelly Care).</p>
    <form id="cfgform">
      <label>Project URL<input name="url" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" required></label>
      <label>anon public key<textarea name="key" placeholder="sb_publishable_..." required style="min-height:100px"></textarea></label>
      <button class="btn" type="submit" style="margin-top:16px">Salva e apri 🏠</button>
      <p class="small muted" style="margin-top:11px;text-align:center">Si fa una volta sola per telefono.</p>
    </form></div>`;
  document.getElementById('cfgform').addEventListener('submit', e => {
    e.preventDefault();
    const url = e.target.url.value.trim().replace(/\/+$/, '').replace(/\/rest\/v1.*$/, ''), key = e.target.key.value.trim();
    if (!/^https:\/\/.+\.supabase\.co$/.test(url)) { alert('Il Project URL deve essere tipo https://xxxx.supabase.co'); return; }
    if (key.length < 20) { alert('La chiave sembra incompleta: copiala tutta.'); return; }
    localStorage.setItem('casa_config', JSON.stringify({ SUPABASE_URL: url, SUPABASE_ANON_KEY: key }));
    location.reload();
  });
  throw new Error('config mancante');
}
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const BUCKET = 'casa';

const S = {
  user: null, profile: null, members: {}, home: null, isAdmin: false,
  rooms: [], measures: [], items: [], expenses: [], warranties: [], docs: [], photos: [],
  suppliers: [], works: [], reminders: [], notes: [], activity: [], settings: null,
  view: 'today', shopMode: false, fRoom: 'all', fStatus: 'all', fPrio: 'all',
  roomOpen: null, chan: null, tick: null
};

const DEFAULT_ROOMS = [
  { name: 'Cucina', emoji: '🍳' }, { name: 'Soggiorno', emoji: '🛋️' },
  { name: 'Camera', emoji: '🛏️' }, { name: 'Camera bimba', emoji: '🧸' },
  { name: 'Bagno 1', emoji: '🚿' }, { name: 'Bagno 2', emoji: '🛁' },
  { name: 'Cabina armadio', emoji: '👗' }, { name: 'Terrazzo', emoji: '🌿' },
  { name: 'Ingresso', emoji: '🚪' }, { name: 'Zona Kelly', emoji: '🐶' }
];

/* Liste tipiche di partenza, stanza per stanza (priorità 1=subito, 2=poi, 3=se avanza) */
const STARTER = {
  'Cucina': [
    ['Set pentole', 1, 'accessorio'], ['Padelle (2-3 misure)', 1, 'accessorio'], ['Set coltelli + tagliere', 1, 'accessorio'],
    ['Piatti (servizio)', 1, 'accessorio'], ['Bicchieri', 1, 'accessorio'], ['Posate', 1, 'accessorio'],
    ['Tazze e tazzine', 1, 'accessorio'], ['Scolapasta e mestoli', 1, 'accessorio'], ['Pattumiera differenziata', 1, 'accessorio'],
    ['Strofinacci e presine', 1, 'tessile'], ['Detersivi e spugne', 1, 'accessorio'], ['Bollitore o caffettiera', 2, 'elettrodomestico'],
    ['Microonde', 2, 'elettrodomestico'], ['Teglie e pirofile', 2, 'accessorio'], ['Contenitori per alimenti', 2, 'accessorio'],
    ['Insalatiera e ciotole', 2, 'accessorio'], ['Bilancia da cucina', 3, 'accessorio'], ['Tostapane', 3, 'elettrodomestico'],
    ['Sgabelli penisola', 2, 'arredo'], ['Lampada sospensione tavolo', 2, 'illuminazione']
  ],
  'Soggiorno': [
    ['Divano', 1, 'arredo'], ['Tavolino', 2, 'arredo'], ['Mobile TV', 2, 'arredo'],
    ['TV', 1, 'elettrodomestico'], ['Staffa TV a muro', 1, 'accessorio'], ['Tende', 1, 'tessile'],
    ['Tappeto', 2, 'tessile'], ['Lampada da terra', 2, 'illuminazione'], ['Cuscini divano', 2, 'tessile'],
    ['Plaid', 3, 'tessile'], ['Quadri / decorazioni', 3, 'accessorio'], ['Piante', 3, 'accessorio'],
    ['Ciabatte e prolunghe', 1, 'accessorio']
  ],
  'Camera': [
    ['Materasso', 1, 'arredo'], ['Rete / giroletto', 1, 'arredo'], ['Cuscini', 1, 'tessile'],
    ['Lenzuola (2 set)', 1, 'tessile'], ['Copripiumino e piumone', 1, 'tessile'], ['Coprimaterasso', 1, 'tessile'],
    ['Comodini', 1, 'arredo'], ['Lampade comodino', 2, 'illuminazione'], ['Tende oscuranti', 1, 'tessile'],
    ['Specchio', 3, 'accessorio'], ['Cestino', 3, 'accessorio']
  ],

/* ---------- foto: compressione lato telefono ---------- */
async function shrink(file, max = 1280, qual = 0.72) {
  if (!file.type.startsWith('image/')) return file;
  const img = await new Promise((res, rej) => {
    const i = new Image(); const u = URL.createObjectURL(file);
    i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u;
  });
  let { width: w, height: h } = img;
  if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', qual));
  return blob && blob.size < file.size ? new File([blob], 'foto.jpg', { type: 'image/jpeg' }) : file;
}
async function upload(file, folder, compress = true) {
  const f = compress ? await shrink(file) : file;
  const ext = (f.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${S.home.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type });
  if (error) throw error;
  return path;
}
const urlCache = {};
async function signed(path) {
  if (!path) return null;
  if (urlCache[path] && urlCache[path].exp > Date.now()) return urlCache[path].url;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600 * 6);
  if (error) return null;
  urlCache[path] = { url: data.signedUrl, exp: Date.now() + 3600 * 5 * 1000 };
  return data.signedUrl;
}

  const form = e.target;
  if (form.dataset.form === 'login') {
    e.preventDefault();
    const d = formData(form);
    localStorage.setItem('casa_email', d.email.trim().toLowerCase());
    form.querySelector('button').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: d.email.trim().toLowerCase(), password: d.password });
    if (error) renderLogin('Email o password non corretti.');
    return;
  }
  if (form.closest('#sheet') && sheetSubmit) {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = 'Attendi…'; }
    try { await sheetSubmit(formData(form), form); }
    catch (err) { console.error(err); toast('Errore: ' + (err.message || err), true); if (btn) { btn.disabled = false; btn.textContent = 'Salva'; } }
  }
});

        if (rows.length) await q(T('casa_items').insert(rows));
      }
      await q(T('casa_activity').insert({ home_id: home.id, created_by: S.user.id, icon: '🏠', text: 'ha creato la casa' }));
      closeSheet(); toast('Casa creata 🏠'); start(S.user);
    });
}

/* ---------- calcoli budget ---------- */
function spentAll() { return S.expenses.reduce((a, e) => a + Number(e.amount || 0), 0); }
function spentRoom(id) { return S.expenses.filter(e => e.room_id === id).reduce((a, e) => a + Number(e.amount || 0), 0); }
function plannedRoom(id) {
  const r = room(id);
  if (r && r.budget_planned) return Number(r.budget_planned);
  return S.items.filter(i => i.room_id === id).reduce((a, i) => a + Number(i.price_est || 0), 0);
}
function toBuy() { return S.items.filter(i => i.status !== 'montato' && i.status !== 'consegnato'); }
function barClass(sp, pl) { if (!pl) return ''; const p = sp / pl; return p > 1 ? 'over' : p > 0.85 ? 'warn' : ''; }
function bar(sp, pl) {
  const w = pl ? Math.min(100, Math.round(sp / pl * 100)) : 0;
  return `<div class="bar"><i class="${barClass(sp, pl)}" style="width:${w}%"></i></div>`;
}

/* ---------- render ---------- */
function render() {
  if (!S.user || !S.home) return;
  const y = window.scrollY;
  $('#nav').hidden = false;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  const views = { today: viewToday, rooms: viewRooms, buy: viewBuy, budget: viewBudget, archive: viewArchive };
  $('#app').innerHTML = views[S.view]();
  window.scrollTo(0, S.view === 'today' ? y : 0);
}

/* ===================== OGGI ===================== */

function nextDeliveries() {
  return S.items.filter(i => i.delivery_date && i.status === 'ordinato' && daysTo(i.delivery_date) >= 0)

    <button class="btn ghost sm" data-a="settings">⚙️</button></div>

    ${late.map(i => `<div class="banner late">📦 ${esc(i.title)}: consegna ${dueTxt(i.delivery_date)}</div>`).join('')}
    ${rem.map(r => `<div class="banner">${esc(remIcon(r.category))} ${esc(r.title)} · ${dueTxt(r.due_date)}</div>`).join('')}
    ${decided.length ? `<div class="banner info">❤️ ${decided.length} articol${decided.length === 1 ? 'o' : 'i'} piace a entrambi: da confermare</div>` : ''}

    <div class="stats">
      <div class="stat"><b>${eur(sp)}</b><span>speso</span></div>
      <div class="stat"><b>${pl ? eur(Math.max(0, pl - sp)) : '—'}</b><span>residuo</span></div>
      <div class="stat"><b>${toBuy().length}</b><span>da comprare</span></div>
    </div>
    ${pl ? bar(sp, pl) : ''}

    <button class="shop-btn" data-a="shop">🛒 MODALITÀ NEGOZIO</button>

    <div class="sec"><h2>📌 Bacheca</h2><button class="btn ghost sm" data-a="addNote">＋ Nota</button></div>
    <div class="list">${notes.map(n => `<div class="it"><button class="ico" data-a="doneNote" data-id="${n.id}">○</button>
      <div class="b"><b>${esc(n.text)}</b><div class="sub">${esc(who(n.created_by))} · ${fmtD(n.created_at)}</div></div>
      <button class="ico" data-a="delRow" data-tb="casa_notes" data-id="${n.id}">🗑</button></div>`).join('')
      || '<div class="empty small">Niente da ricordare. Tocca ＋ Nota.</div>'}</div>

    ${next.length ? `<div class="sec"><h2>📦 Prossime consegne</h2></div>
    <div class="list">${next.map(i => `<div class="it"><div class="e">🚚</div><div class="b"><b>${esc(i.title)}</b>
      <div class="sub">${esc(roomName(i.room_id))} · ${fmtDFull(i.delivery_date)}</div></div>
      <div class="rt">${dueTxt(i.delivery_date)}</div></div>`).join('')}</div>` : ''}

    <div class="sec"><h2>🕒 Attività recenti</h2></div>
    <div class="list">${S.activity.slice(0, 8).map(a => `<div class="it"><div class="e">${esc(a.icon || '•')}</div>
      <div class="b"><b>${esc(who(a.created_by))} ${esc(a.text)}</b><div class="sub">${fmtDT(a.created_at)}</div></div></div>`).join('')
      || '<div class="empty small">Ancora nessuna attività.</div>'}</div>
    <div style="height:20px"></div>`;
}
function remIcon(c) { return { consegna: '📦', pagamento: '💳', lavoro: '🔧', appuntamento: '📅' }[c] || '🔔'; }

/* ===================== STANZE E MISURE ===================== */
function viewRooms() {
  if (S.roomOpen) return viewRoomDetail(S.roomOpen);
  return `<div class="top"><h1>Stanze</h1><button class="btn ghost sm" data-a="editRoom">＋ Stanza</button></div>
    <div class="list">${S.rooms.map(r => {
      const items = S.items.filter(i => i.room_id === r.id);

        <div class="b"><b>${esc(r.name)}</b>
          <div class="sub">${items.length} articoli${miss ? ` · ${miss} da completare` : ' · completa ✓'} · ${S.measures.filter(m => m.room_id === r.id).length} misure</div>

}

    ${pl ? bar(sp, pl) : ''}

      ${STARTER_MEASURES[r.name] ? `<button class="btn ghost sm" data-a="starterM" data-id="${id}">＋ Da planimetria</button>` : ''}

    <div class="sec"><h2>🛒 Articoli</h2><div class="row tight" style="gap:6px">
      ${STARTER[r.name] ? `<button class="btn ghost sm" data-a="starter" data-id="${id}">＋ Lista tipica</button>` : ''}
      <button class="btn ghost sm" data-a="editItem" data-room="${id}">＋ Articolo</button></div></div>

    ${tl.length ? `<div class="ph">${tl.map(p => `<img src="${p.url}" data-a="viewPhoto" data-id="${p.id}" alt="">`).join('')}</div>` : '<div class="empty small">Una foto al mese e a fine lavori avrai il prima/dopo.</div>'}

/* ===================== ACQUISTI ===================== */
function itemRow(i) {
  const loves = i.loves || [];

  const price = i.price_real || i.price_est;
  return `<div class="it ${both ? 'ok' : ''}">
    <div class="e">${st.e}</div>
    <div class="b" data-a="editItem" data-id="${i.id}">

/* ---------- MODALITÀ NEGOZIO ---------- */
function viewShop() {

      || '<div class="empty small">Niente da comprare qui 🎉</div>'}</div>
    <div style="height:20px"></div>`;
}

const A = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) { e.preventDefault(); A[el.dataset.a](el.dataset, el); return; }
  const ch = e.target.closest('[data-choices] button');
  if (ch) {
    const box = ch.parentElement, multi = box.dataset.multi === '1';
    if (!multi) box.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    ch.classList.toggle('on');
    box.parentElement.querySelector(`input[name="${box.dataset.choices}"]`).value =
      [...box.querySelectorAll('button.on')].map(b => b.dataset.val).join(',');
    return;
  }
  if (e.target.id === 'overlay') closeSheet();
});

/* --- impostazioni --- */
A.settings = () => {
  const h = S.home;
  openSheet('⚙️ Impostazioni', `<form>
    ${F.text('name', 'Nome casa', h.name)}${F.text('address', 'Indirizzo', h.address || '')}
    <div class="pair">${F.num('budget_total', 'Budget complessivo (€)', h.budget_total || '')}${F.date('move_date', 'Trasloco', h.move_date || '')}</div>
    ${F.submit('Salva')}</form>
    <div class="sec"><h2>Chi c'è</h2></div>
    <div class="members">${Object.values(S.members).map(m => `<span>${esc(m.display_name || 'senza nome')}${m.id === S.user.id ? ' (tu)' : ''}${h.admin_id === m.id ? ' 👑' : ''}</span>`).join('')}</div>
    <div class="row" style="margin-top:18px"><button class="btn sec" data-a="editMe">✏️ Il mio nome</button><button class="btn ghost" data-a="logout">Esci</button></div>
    <p class="small muted" style="text-align:center;margin-top:16px">Casa Nuova · privata, solo per voi due 🏠<br>
    <button class="btn ghost sm" data-a="resetCfg">Cambia chiavi Supabase</button></p>`,
    async d => {
      await q(T('casa_home').update({ name: d.name || 'Casa nuova', address: d.address || null, budget_total: d.budget_total || null, move_date: d.move_date || null }).eq('id', h.id));
      closeSheet(); await refresh(); toast('Impostazioni salvate');
    });
};
A.editMe = () => openSheet('Il tuo nome', `<form>${F.text('name', 'Nome', S.profile.display_name || '')}${F.submit()}</form>`,
  async d => { await q(T('profiles').update({ display_name: d.name }).eq('id', S.user.id)); closeSheet(); await refresh(); toast('Nome aggiornato'); });
A.resetCfg = () => { if (confirm('Rimuovere le chiavi da questo telefono? I dati restano su Supabase.')) { localStorage.removeItem('casa_config'); sb.auth.signOut(); location.reload(); } };

</script>
</body>
</html>
